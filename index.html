<!DOCTYPE html>
<html>
<head>

    <title>QA Login Demo</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>QA Login Demo</h1>

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button onclick="login()">
            Login
        </button>

        <div id="message"></div>

    </div>


    <script>

        function login() {

            let username =
                document.getElementById("username").value;

            let password =
                document.getElementById("password").value;

            let message =
                document.getElementById("message");


            if (username === "" || password === "") {

                message.innerText =
                    "Username and Password are required.";

                return;
            }


            if (username === "admin" && password === "admin123") {

                message.innerText =
                    "Login successful!";

            } else {

                message.innerText =
                    "Invalid username or password.";

            }

        }

    </script>

</body>

</html>
