name: QA Login Demo Pipeline

on:
  push:
    branches:
      - main

jobs:
  qa-validation:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Application Files
        run: |
          echo "Checking QA Login Demo files"
          ls -la

      - name: Build Docker Image
        run: docker build -t qa-login-demo:1.0 .

      - name: Verify Docker Image
        run: docker images